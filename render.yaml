services:
  - type: web
    name: acadex-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && bash ../connect_pbl/compile.sh
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DEFAULT_STUDENT_PASSWORD
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
